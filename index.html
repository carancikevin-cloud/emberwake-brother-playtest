  }, {
    id: "HOME_ORDINARY",
    category: "Home",
    title: "Before the Title",
    unlockEvent: "patrol-stores-clear",
    body: `The first tool in your hands was not a hero's weapon. It was what could be found near the door.

Sanctuary keeps no list of whose work counts as courage. Someone must go beyond the fence. Someone must mend it. When the person on watch comes home hungry, someone must have remembered the field. The class you learn gives a name to how you fight. It does not erase the person who chose to help.`
  }, {
    id: "PERSON_LUNA",
    category: "People & Paths",
    title: "The Waykeeper",
    unlockEvent: "luna-welcome",
    body: `Luna once tended routes between lantern settlements. Her maps have crossings marked in two inks: one for a road she has walked, another for a road someone lived long enough to describe.

She still carries both. A gap in the map is a reason to prepare, not a reason to pretend she knows what lies there. Around Sanctuary she is easier to find by the jobs she has half-finished than by any title. Someone always needs directions. Someone always has a leaking roof.`
  }, {
    id: "CLASS_WARDEN",
    category: "People & Paths",
    title: "The Steady Flame",
    unlockEvent: "class-warden",
    body: `Wardens learned their first formations in doorways. A narrow entrance, a shield, and someone behind them who needed time.

Their lanterns do not make them fearless. They make the space around them harder to take. When a blow meets the ward, a Warden answers to remind the attacker that shelter is being held by a person.`
  }, {
    id: "CLASS_DUELIST",
    category: "People & Paths",
    title: "The Hungry Spark",
    unlockEvent: "class-duelist",
    body: `There were roads too narrow for a formation and messengers too important to lose. Duelists learned to finish a fight before the next traveller reached it.

They count openings rather than bodies. A measured cut can do the work of a wild flurry, provided the bearer has the nerve to wait one beat longer. Their seal is a promise that someone else can follow.`
  }, {
    id: "CLASS_CINDER",
    category: "People & Paths",
    title: "The Patient Pyre",
    unlockEvent: "class-cinder",
    body: `Cinder Mages began as keepers of fires that could not be allowed to die. They knew which wood would last the night and how much warmth remained under a skin of ash.

On the road, that patience becomes dangerous. Every strike leaves a little fire behind. Furnace Breath gives the gathered heat somewhere to go. A cinder is a small thing until someone has been careful with it.`
  }, {
    id: "CLASS_SANGROMANCER",
    category: "People & Paths",
    title: "The Crimson Debt",
    unlockEvent: "class-sangromancer",
    body: `When the healers ran short of clean bandages, some began studying the wound itself. The first blood-workers learned to keep a person alive with what that person still carried.

The Sangromancer took that knowledge onto the road. Crimson Tithe spends the bearer's own strength; it cannot quietly assign the price to someone else. A debt may be partly recovered when the foe falls. It is never made harmless by calling it a spell.`
  }, {
    id: "CLASS_THORNSWORN",
    category: "People & Paths",
    title: "The Living Boundary",
    unlockEvent: "class-thornsworn",
    body: `The hedge outlasted the farm. A woman who returned to mend the fence found new growth around every broken post. She cut a length, planted it beside the next ruined garden, and waited.

The Thornsworn still carry pieces of those hedges. Briar grows around a held boundary. They can leave it ready to answer a blow, or release it and take shelter. Endurance is knowing which kind of courage the next moment needs.`
  }, {
    id: "CLASS_BELLWRIGHT",
    category: "People & Paths",
    title: "An Answer Carried",
    unlockEvent: "reach-discovered",
    victoryEvent: "bellwright-unlocked",
    body: `Before lantern roads joined the settlements of the Reach, bells carried news over the ravines. One tower warned of fire. The next repeated it. A third answered that its people were moving.

A Bellwright learns the space between those notes: the moment in which another person can act. Answering Toll cannot stop time. It can make room inside a dangerous second.`,
    victoryBody: "After the trial, the distant tower rings again. This time a second bell answers it. That is the beginning of the work."
  }, {
    id: "ROAD_01",
    category: "The Eight Roads",
    title: "Gloamwood",
    unlockEvent: "enter-gloamwood",
    victoryEvent: "victory-hart",
    body: "Fence posts disappear beneath roots here. The oldest trees grew around roads that people kept trying to use, and the Rootbound Hart learned every crossing by the weight of feet on the soil. It guards the paths without remembering who they were meant to carry.",
    victoryBody: "Beyond the broken antlers, the road is still there. Someone had been right to keep clearing it."
  }, {
    id: "ROAD_02",
    category: "The Eight Roads",
    title: "Mirrorfen",
    unlockEvent: "enter-mirrorfen",
    victoryEvent: "victory-ferryman",
    body: "The water preserves a second version of every lantern. Some travellers began following the reflection when the bank vanished. The Pallid Ferryman still takes a fare, though the landing has been drowned for years.",
    victoryBody: "A post emerges from the water with a rope still tied around it. The crossing can be marked again."
  }, {
    id: "ROAD_03",
    category: "The Eight Roads",
    title: "Cinder Crown",
    unlockEvent: "enter-cinder-crown",
    victoryEvent: "victory-vesper",
    body: "Before the failed morning, the highest roofs caught the sun first. Vesper made her crown from that expectation. Below it, the streets kept their lamps lit through days that no longer had a name.",
    victoryBody: "Light reaches Sanctuary's windows without being carried there. The first dawn is real. More roads remain dark, but this one victory belongs to the people who waited for it."
  }, {
    id: "ROAD_04",
    category: "The Eight Roads",
    title: "The Brass Way",
    subtitle: "Bellworn March",
    unlockEvent: "enter-brass-way",
    victoryEvent: "victory-cantor",
    body: "The warning procession never received the order to stop. Brass wheels cut the same road deeper, and the Cantor's clapper still calls people to a shelter that has fallen down.",
    victoryBody: "The silence is not empty. For the first time, you can hear the wind move through the road grass."
  }, {
    id: "ROAD_05",
    category: "The Eight Roads",
    title: "The Undertow",
    subtitle: "Drowned Archive",
    unlockEvent: "enter-undertow",
    victoryEvent: "victory-dredge",
    body: "Dredge hauled records from the flooded halls until the ink ran into its hands. It kept the pages even after it could no longer read them. Now every warm traveller seems like another name about to be lost.",
    victoryBody: "A ledger dries beside the lantern. Most of its entries are gone. One address is legible enough to follow."
  }, {
    id: "ROAD_06",
    category: "The Eight Roads",
    title: "The Cinder Court",
    subtitle: "Court of Unspent Ash",
    unlockEvent: "enter-cinder-court",
    victoryEvent: "victory-court",
    body: "Once, people brought disputes here because they believed a neighbour could be heard. When the petitions stopped arriving, the Court continued delivering judgment. Its empty collars disagree about the verdict and agree that someone must pay.",
    victoryBody: "No voice answers the last decree. Beyond the throne, an unlocked side door opens onto an ordinary street."
  }, {
    id: "ROAD_07",
    category: "The Eight Roads",
    title: "The Pale Throne",
    subtitle: "Borrowed Palace",
    unlockEvent: "enter-pale-throne",
    victoryEvent: "victory-regent",
    body: "The Regent has collected the gestures of people who stood against the Gloom: a shield held level, a blade raised with confidence, a hand ringing a bell. It can perform the gestures. It has never had someone behind it worth protecting.",
    victoryBody: "The borrowed posture fails. Your own hands are shaking, and they are still your hands."
  }, {
    id: "ROAD_08",
    category: "The Eight Roads",
    title: "The Unmorning",
    subtitle: "Unrisen Horizon",
    unlockEvent: "enter-unmorning",
    victoryEvent: "victory-unrisen",
    body: "A captive remnant of dawn learned to keep every returning ray within its ribs. It survived by refusing release, until survival and imprisonment became the same movement. When its first shell falls, it closes around the light once more.",
    victoryBody: "The cage opens. Light leaves in more than one direction, and a shard remains in the lantern. It points toward roads this sky cannot contain."
  }, {
    id: "ADV_WOLF",
    category: "The Eight Roads",
    title: "Wolf / Alpha Wolf",
    unlockEvent: "patrol-fence-clear",
    body: "The packs learned to hunt near the last warm fields. The largest stays beyond the fence until the smaller ones have tested it. Hunger has made them bold; it has not made them servants of the Gloom."
  }, {
    id: "ADV_GLOOM_HERALD",
    category: "The Eight Roads",
    title: "Gloom Herald",
    unlockEvent: "deep-act-4-open",
    body: "The coat is empty. The warning is not. Each peal gives the thing inside another shape to push against the world."
  }, {
    id: "ADV_SUNDERFIEND",
    category: "The Eight Roads",
    title: "Sunderfiend",
    unlockEvent: "deep-act-5-open",
    body: "It once opened gates for people fleeing a siege. The gatebreaker remembers the resistance of iron better than the people passing through."
  }, {
    id: "ADV_NEEDLE_SAINT",
    category: "The Eight Roads",
    title: "Needle Saint",
    unlockEvent: "deep-act-6-open",
    body: "Pilgrims left needles at the shrine for wounds to be closed. The Saint gathered them after the shrine fell. It remembers the wound and has forgotten the closing."
  }, {
    id: "ADV_BULWARK_HUSK",
    category: "The Eight Roads",
    title: "Bulwark Husk",
    unlockEvent: "deep-act-7-open",
    body: "It carried a door into the road and held it there. The house behind it is gone. The effort remains."
  }, {
    id: "ADV_DAWN_SCAVENGER",
    category: "The Eight Roads",
    title: "Dawn Scavenger",
    unlockEvent: "act-8-open",
    body: "It learned to follow the sunrise. Now it follows whoever is carrying a little of it."
  }, {
    id: "ADV_REMNANTS",
    category: "The Eight Roads",
    title: "Remnants",
    unlockEvent: "first-world-passage",
    body: "A victory can be real while its damage is still being repaired. These are shapes left in the broken roads: the Hart's charge, the Ferryman's crossing, Vesper's hunger. Name the remnant for what it recalls. Do not mistake it for the undoing of the person who first defeated it."
  }, {
    id: "RELIC_coalheart",
    category: "Relics",
    title: "Coalheart",
    unlockEvent: "relic:coalheart",
    body: "The hearth went cold. The coal refused to believe the family was not coming back."
  }, {
    id: "RELIC_quickwick",
    category: "Relics",
    title: "Quickwick",
    unlockEvent: "relic:quickwick",
    body: "A midwife tied this knot when the road was long and someone could not wait."
  }, {
    id: "RELIC_glassguard",
    category: "Relics",
    title: "Glassguard",
    unlockEvent: "relic:glassguard",
    body: "The house is gone. The window still knows which side the night belongs on."
  }, {
    id: "RELIC_bramble",
    category: "Relics",
    title: "Ashen Bramble",
    unlockEvent: "relic:bramble",
    body: "The garden is gone. The hedge still guards it."
  }, {
    id: "RELIC_kindling",
    category: "Relics",
    title: "Kindling Knife",
    unlockEvent: "relic:kindling",
    body: "Before it learned to hurt, it made enough warmth for four."
  }, {
    id: "RELIC_duelistseal",
    category: "Relics",
    title: "Duelist’s Seal",
    unlockEvent: "relic:duelistseal",
    body: "A promise pressed into wax: the road behind me stays open."
  }, {
    id: "RELIC_cinderbrand",
    category: "Relics",
    title: "Cinderbrand",
    unlockEvent: "relic:cinderbrand",
    body: "At the Pyre of Names, they burn the paper so the words can rise."

    id: "RELIC_mercybell",
    category: "Relics",
    title: "Mercy Bell",
    unlockEvent: "relic:mercybell",

  }, {

    title: "Bloodflame Vial",
    unlockEvent: "relic:bloodflame",

  }, {
    id: "RELIC_echochain",
    category: "Relics",
    title: "Echo Chain",

  }, {
    id: "RELIC_smokeshroud",
    category: "Relics",
    title: "Smoke Shroud",
    unlockEvent: "relic:smokeshroud",
    body: "A mother hid her children beneath it. The dark still counts one shadow too few."
  }, {
    id: "RELIC_ashmagnet",
    category: "Relics",
    title: "Ash Magnet",
    unlockEvent: "relic:ashmagnet",
    body: "It pulls hardest toward things someone meant to come back for."
  }, {
    id: "RELIC_sunshard",
    category: "Relics",
    title: "Sunshard",
    unlockEvent: "relic:sunshard",
    body: "Small enough to carry. Too stubborn to stop being morning."
  }, {
    id: "RELIC_deepwell",
    category: "Relics",
    title: "Deepwell Flask",
    unlockEvent: "relic:deepwell",
    body: "A cup was lowered into the well each night. Each morning, the well gave it back full."
  }, {
    id: "RELIC_lastlight",
    category: "Relics",
    title: "Last Light",
    unlockEvent: "relic:lastlight",
    body: "You are not its last bearer. That is what it is trying to tell you."
  }, {
    id: "RELIC_barbedspool",
    category: "Relics",
    title: "Barbed Spool",
    unlockEvent: "relic:barbedspool",
    body: "The seamstress kept the last needle for whatever came through the door."
  }, {
    id: "RELIC_mirroraegis",
    category: "Relics",
    title: "Mirror Aegis",
    unlockEvent: "relic:mirroraegis",
    body: "It remembers every blow it stood between."
  }, {
    id: "RELIC_trophyrack",
    category: "Relics",
    title: "Trophy Rack",
    unlockEvent: "relic:trophyrack",
    body: "Every trophy on it was once the thing its bearer feared most."

    id: "RELIC_pyrechant",
    category: "Relics",
    title: "Pyre Chant",
    unlockEvent: "relic:pyrechant",
    body: "No two survivors remember the same words. They sing together anyway."
  }, {
    id: "RELIC_emberdrum",
    category: "Relics",
    title: "Ember Drum",
    unlockEvent: "relic:emberdrum",
    body: "The drummer fell. The others kept the count."
  }, {
    id: "RELIC_wayfarersknot",
    category: "Relics",
    title: "Wayfarer’s Knot",

  }, {
    id: "RELIC_firestarterskit",
    category: "Relics",
    title: "Firestarter’s Kit",

    body: `A wake is a place where light still has a route home. Hearthwake was the first one you knew. Beyond its repaired crossing lies Nearwake, where familiar roads lead farther than they should.

    id: "BEYOND_STILLFIRE",
    category: "Beyond the Roads",
